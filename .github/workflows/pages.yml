name: Deploy docs to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  models: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/site-i18n/package-lock.json

      - name: Install translation tooling
        run: npm ci --prefix tools/site-i18n

      - name: Validate multilingual build
        run: npm run validate --prefix tools/site-i18n -- --site "$GITHUB_WORKSPACE/_site"

      - name: Restore translation cache
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: .translation-cache
          key: site-translations-v1-${{ github.run_id }}
          restore-keys: |
            site-translations-v1-

      - name: Generate translated editions
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run translate --prefix tools/site-i18n -- --site "$GITHUB_WORKSPACE/_site"

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
