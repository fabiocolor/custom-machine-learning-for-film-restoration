  slide09:
  - file: slide09-01-faded-source-frame.png
    kind: image
    width: 1920
    height: 1440
    mb: 2.8
    label:
      en: Faded source
      pt-br: Fonte desbotada
      es: Fuente desvanecida
    caption:
