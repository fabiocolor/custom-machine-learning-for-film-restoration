name: Research storage boundary
on: [push, pull_request]
jobs:
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B .research/storage_guard.py --tree HEAD
      - run: python3 -B -m unittest discover -s .research/tests -p 'test_*.py'
