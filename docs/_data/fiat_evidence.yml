      pt-br: 'Um quadro do resultado em tamanho real: a cor do DVD sobre o detalhe e o grão da digitalização 16mm.'
      es: 'Un fotograma del resultado a tamaño completo: el color del DVD sobre el detalle y el grano del escaneo de 16mm.'
    site_path: /images_kebab/candy-candy/candy-candy-chroma-recovery-finished.png
