      pt-br: 'Três quadros: o original em nitrato; uma versão inicial em que o Wan VACE 14B gerou cada quadro danificado por inteiro (0% original); e a versão seguinte, que manteve a imagem sobrevivente e gerou apenas os blocos danificados (47,6% original). As duas foram substituídas para manter mais do original.'
      es: 'Tres fotogramas: el original en nitrato; una versión temprana en la que Wan VACE 14B generó cada fotograma dañado por completo (0% original); y la versión siguiente, que conservó la imagen superviviente y generó solo los mosaicos dañados (47,6% original). Ambas fueron reemplazadas para conservar más del original.'
