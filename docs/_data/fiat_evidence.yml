      pt-br: 'A imagem do slide 4: o quadro inteiro em uma única passada contra quatro blocos unidos, com a torre do salva-vidas ampliada embaixo de cada um.'
      es: 'La imagen de la diapositiva 4: el fotograma completo en una sola pasada frente a cuatro mosaicos unidos, con la torre del salvavidas ampliada debajo de cada uno.'
  slide05:
  - file: slide05-01-faded-16mm-scan.png
    kind: image
    width: 3024
    height: 1890
    mb: 4.3
    label:
      en: Faded 16mm scan
      pt-br: Digitalização 16mm desbotada
      es: Escaneo de 16mm desvanecido
    caption:
      en: A frame of the faded 16mm print before any correction. It has a strong magenta cast, and most of the flicker is in the red channel.
      pt-br: Um quadro da cópia 16mm desbotada antes de qualquer correção. Tem uma forte dominante magenta, e a maior parte da cintilação está no canal vermelho.
      es: Un fotograma de la copia de 16mm desvanecida antes de cualquier corrección. Tiene una fuerte dominante magenta, y la mayor parte del parpadeo está en el canal rojo.
    site_path: /images_kebab/candy-candy/candy-candy-faded-balancer-raw.png
  - file: slide05-02-balanced-scan.png
    kind: image
    width: 3024
    height: 1890
    mb: 4.3
    label:
      en: Balanced scan
      pt-br: Digitalização equilibrada
      es: Escaneo equilibrado
    caption:
      en: The same frame after the Faded Balancer DCTL in Resolve, which evens out the faded colour channels before training.
      pt-br: O mesmo quadro depois do Faded Balancer DCTL no Resolve, que equilibra os canais de cor desbotados antes do treinamento.
      es: El mismo fotograma después del Faded Balancer DCTL en Resolve, que equilibra los canales de color desvanecidos antes del entrenamiento.
    site_path: /images_kebab/candy-candy/candy-candy-faded-balancer-finished.png
  - file: slide05-03-training-setup-in-nuke.png
    kind: image
    width: 1230
    height: 1602
    mb: 0.6
    label:
      en: Training setup in Nuke
      pt-br: Treinamento montado no Nuke
      es: Configuración de entrenamiento en Nuke
    caption:
      en: The CopyCat training graph. The scan frames are the input; the target keeps the scan's brightness and takes the DVD's colour.
      pt-br: O grafo de treinamento do CopyCat. Os quadros da digitalização são a entrada; o alvo mantém o brilho da digitalização e pega a cor do DVD.
      es: El grafo de entrenamiento de CopyCat. Los fotogramas del escaneo son la entrada; el objetivo conserva el brillo del escaneo y toma el color del DVD.
    site_path: /images_kebab/cropped/copycat-training-cropped.png
  - file: slide05-04-training-steps.jpeg
    kind: image
    width: 1920
    height: 886
    mb: 0.2
    label:
      en: Training steps
      pt-br: Etapas de treinamento
      es: Pasos de entrenamiento
    caption:
      en: The 16mm source plus the PAL DVD gives the target. Below, the model's result after 1, 1,000, 30,000 and 60,000 training steps.
      pt-br: A fonte 16mm mais o PAL DVD dão o alvo. Abaixo, o resultado do modelo depois de 1, 1.000, 30.000 e 60.000 etapas de treinamento.
      es: La fuente de 16mm más el PAL DVD da el objetivo. Abajo, el resultado del modelo tras 1, 1.000, 30.000 y 60.000 pasos de entrenamiento.
    site_path: /images_kebab/candy-candy/candy-candy-training-steps.jpeg
  - file: slide05-05-recovered-frame.png
    kind: image
    width: 2742
    height: 2112
    mb: 7.6
    label:
      en: Recovered frame
      pt-br: Quadro recuperado
      es: Fotograma recuperado
    caption:
