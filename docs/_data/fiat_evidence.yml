      pt-br: 'Um quadro do plano da multidão como sobrevive na cópia desbotada: 338 quadros em 1920 × 1440.'
      es: 'Un fotograma del plano de la multitud tal como sobrevive en la copia de película desvanecida: 338 fotogramas a 1920 × 1440.'
    site_path: /images_kebab/seapavaa2026/originals/fanji_waterfront_workflow/01_source.png
  - file: slide09-02-approved-colour-reference.png
    kind: image
    width: 1184
    height: 880
    mb: 1.0
    label:
      en: Approved reference
      pt-br: Referência aprovada
      es: Referencia aprobada
    caption:
      en: 'The one approved reference: a Qwen Image Edit recovery of one frame of the shot. TeleStyle received it, together with each faded frame, for every frame of the shot.'
      pt-br: 'A única referência aprovada: uma recuperação de um quadro do plano feita com o Qwen Image Edit. O TeleStyle a recebeu, junto com cada quadro desbotado, para todos os quadros do plano.'
      es: 'La única referencia aprobada: una recuperación con Qwen Image Edit de un fotograma del plano. TeleStyle la recibió, junto con cada fotograma desvanecido, para cada fotograma del plano.'
